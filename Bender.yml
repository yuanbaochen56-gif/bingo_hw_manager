package:
  name: bingo_hw_manager
  authors:
    - Fanchen Kong <fanchen.kong@kuleuven.be>
    - Xiaoling Yi  <xiaoling.yi@kuleuven.be>
    - Yunhao Deng  <yunhao.deng@kuleuven.be>
dependencies:
  axi:          { git: https://github.com/pulp-platform/axi,              version:  0.39.1 }
  common_cells: { git: https://github.com/pulp-platform/common_cells.git, version:  1.37.0 }

sources:
  # Source files grouped in levels. Files in level 0 have no dependencies on files in this package.
  # Files in level 1 only depend on files in level 0.
  # Files in level 2 on files in levels 1 and 0, etc.

  # Level 0
  - src/bingo_hw_manager_mailbox_adapter.sv    # AXI Lite to Mailbox Adapter
  - src/bingo_hw_manager_read_mailbox.sv       # AXI Lite read Mailbox Module
  - src/bingo_hw_manager_write_mailbox.sv      # AXI Lite write Mailbox Module
  - src/bingo_hw_manager_task_queue_master.sv  # Task Queue Master Module
  - src/bingo_hw_manager_csr_to_fifo_write.sv  # CSR to FIFO Write 
  - src/bingo_hw_manager_csr_to_fifo_read.sv   # CSR to FIFO Read
  - src/bingo_hw_manager_csr_to_fifo.sv        # CSR to FIFO Interface Module
  # Level 1
  - src/bingo_hw_manager_cond_exec_controller.sv # DARTS: CERF
  - src/bingo_hw_manager_load_monitor.sv         # DARTS: Load Monitor
  - src/bingo_hw_manager_watchdog.sv           # core state monitoring and dead core detection
  - src/bingo_hw_manager_substitute_sel.sv     # Substitute of a fenced core (remap and replay)
  - src/bingo_hw_manager_core_remap.sv         # Core remap selector
  - src/bingo_hw_manager_replay_ctrl.sv        # Replay of a fenced core's outstanding tasks
  - src/bingo_hw_manager_ctrl.sv             # Control plane: slot mapping table (substitutes)
  - src/bingo_hw_manager_dep_matrix.sv         # Dependency Matrix Module
  - src/bingo_hw_manager_chiplet_dep_set.sv    # Chiplet DependencySetModule (The Master port to send chiplet dep set info to other chiplets)
  - src/bingo_hw_manager_dep_check_manager.sv  # Dependency Check Manager Module
  - src/bingo_hw_manager_pm.sv                 # Power Management Module
  - src/bingo_hw_manager_remote_link.sv        # Level 3 transport: remote dispatch / done over AXI-Lite
  # Level 2
  - src/bingo_hw_manager_top.sv                # Top-level module
  - target: test
    # Expose the test/ dir as an include path so the tb `include "..._harness.svh"
    # (and the tb_stimulus_*.svh) resolve when this `test` target is pulled into an
    # external bender compile (e.g. HeMAiA's system sim uses `-t test`). Without this,
    # only compile_vsim.sh's shell-glob added the incdir, so external consumers hit
    # Error-[SFCOR] on the harness include.
    include_dirs:
      - test
    files:
      - test/bingo_tb_axi_lite_stall.sv                    # helper: random AXI-Lite handshake stalls
      - test/tb_bingo_hw_manager_dep_matrix.sv
      - test/tb_bingo_hw_manager_top.sv
      - test/tb_bingo_hw_manager_cerf_basic.sv
      - test/tb_bingo_hw_manager_cerf_skip.sv
      - test/tb_bingo_hw_manager_cerf_fallback.sv  # stuck core type clears one CERF group and sets another
      - test/tb_bingo_hw_manager_cerf_fallback_join.sv  # the stuck type's own tasks of the cleared group retire as skipped
      - test/tb_bingo_hw_manager_cerf_fallback_order.sv  # a lost task the CERF keeps still blocks the later skips of its core
      - test/tb_bingo_hw_manager_cerf_fallback_multi.sv  # two stuck types degrade lowest first; clear == set
      - test/tb_bingo_hw_manager_cerf_fallback_reject.sv  # a level-3 reject degrades the group; the proxy's skipped tasks retire
      - test/tb_bingo_hw_manager_cerf_fallback_double.sv      # CERF degradation: both cores of a type die, the stuck substitute drains the first one's heads
      - test/tb_bingo_hw_manager_cerf_fallback_double_off.sv  # same without ForeignStuckDrain: stays stuck (the P5b boundary)
      - test/tb_bingo_hw_manager_cerf_fallback_double_order.sv  # same with a still-needed dead-core head: it stays, nothing passes it
      - test/tb_bingo_hw_manager_tagged.sv      # identity-aware deps end-to-end
      - test/tb_bingo_hw_manager_tagged_mc.sv   # identity-aware deps, MULTI-CLUSTER cross-cluster aliasing
      - test/tb_bingo_hw_manager_watchdog.sv
      - test/tb_bingo_hw_manager_core_remap.sv
      - test/tb_bingo_hw_manager_remap_probe.sv
      - test/tb_bingo_hw_manager_remap_full_flow.sv
      - test/tb_bingo_hw_manager_heartbeat.sv
      - test/tb_bingo_hw_manager_heartbeat_long_task.sv
      - test/tb_bingo_hw_manager_remap_passthrough.sv
      - test/tb_bingo_hw_manager_remap_dead_suspect.sv
      - test/tb_bingo_hw_manager_remap_busy_no_remap.sv   # healthy busy core keeps its tasks
      - test/tb_bingo_hw_manager_remap_dummy_set_order.sv # dummy-set waits for its same-core source
      - test/tb_bingo_hw_manager_remap_sticky_order.sv    # dead core's tasks go to one substitute, in order
      - test/tb_bingo_hw_manager_remap_dummy_after_remap.sv # dummy-set waits for remapped earlier tasks
      - test/tb_bingo_hw_manager_remap_mask_off.sv        # CoreRemapAllowMask='0: detection only (HeMAiA)
      - test/tb_bingo_hw_manager_csr_heartbeat_addr.sv    # heartbeat on CSR 0x5fe + masked slot (HeMAiA)
      - test/tb_bingo_hw_manager_replay_lost_task.sv       # running task of a dead core replayed
      - test/tb_bingo_hw_manager_no_replay_normal.sv
      - test/tb_bingo_hw_manager_replay_no_replay.sv
      - test/tb_bingo_hw_manager_replay_no_replay_queued.sv
      - test/tb_bingo_hw_manager_replay_no_replay_cerf.sv
      - test/tb_bingo_hw_manager_replay_no_replay_l3.sv
      - test/tb_bingo_hw_manager_replay_no_replay_foreign.sv
      - test/tb_bingo_hw_manager_replay_no_replay_foreign_off.sv
      - test/tb_bingo_hw_manager_replay_queued_tasks.sv    # queued normal/dummy/skipped entries moved in order
      - test/tb_bingo_hw_manager_replay_sequencing_edge.sv # same-core edge behind the lost task
      - test/tb_bingo_hw_manager_replay_slow_not_dead.sv   # silent between the timeouts: no fence
      - test/tb_bingo_hw_manager_replay_zombie.sv          # fenced core's late done dropped
      - test/tb_bingo_hw_manager_replay_done_race.sv       # done vs confirm timeout, exactly once
      - test/tb_bingo_hw_manager_replay_no_substitute.sv   # AllowMask '0: replay_stuck, rest runs
      - test/tb_bingo_hw_manager_replay_chain.sv           # substitute dies too
      - test/tb_bingo_hw_manager_replay_chain_partial.sv   # substitute dies mid-MOVE: order kept
      - test/tb_bingo_hw_manager_replay_stuck_other_core.sv # a stuck core does not block another replay
      - test/tb_bingo_hw_manager_replay_two_clusters.sv    # replay inside cluster 1
      - test/tb_bingo_hw_manager_replay_disabled.sv        # confirm timeout 0: detection only
      - test/tb_bingo_hw_manager_xcl_fallback.sv           # level 2: substitute in another cluster
      - test/tb_bingo_hw_manager_xcl_prefer_local.sv       # level 2: own cluster preferred
      - test/tb_bingo_hw_manager_xcl_two_faults.sv         # level 2: two dead cores, two clusters
      - test/tb_bingo_hw_manager_xcl_no_substitute.sv      # level 2: none in the chiplet, rest runs
      - test/tb_bingo_hw_manager_xcl_disabled.sv           # level 2 off (default): stuck
      - test/tb_bingo_hw_manager_remote_dispatch.sv        # level 3: dead core's tasks run on the other chiplet
      - test/tb_bingo_hw_manager_remote_full_queue.sv      # level 3: export from a full checkout queue, in order
      - test/tb_bingo_hw_manager_remote_no_executor.sv     # level 3: no live core of the type anywhere
      - test/tb_bingo_hw_manager_remote_done_mismatch.sv   # level 3: wrong remote done task id stops the proxy
      - test/tb_bingo_hw_manager_remote_done_stray.sv      # level 3: a done / reject for no proxy slot is dropped
      - test/tb_bingo_hw_manager_remote_link.sv            # level 3 transport adapter unit test
      - test/tb_bingo_hw_manager_chiplet_mailbox_ro.sv     # chiplet done-queue mailbox: only MBOXW is writable remotely
      - test/tb_bingo_hw_manager_rlink_dispatch.sv         # level 3 over remote_link + xbar: remote_dispatch
      - test/tb_bingo_hw_manager_rlink_full_queue.sv       # level 3 over remote_link + xbar: remote_full_queue
      - test/tb_bingo_hw_manager_rlink_no_executor.sv      # level 3 over remote_link + xbar: remote_no_executor
      - test/tb_bingo_hw_manager_rlink_done_order.sv       # level 3 over remote_link: two proxy slots, done order
      - test/tb_bingo_hw_manager_rlink_credit_exhaust.sv   # level 3 over remote_link: one credit
      - test/tb_bingo_hw_manager_rlink_hol.sv               # level 3, two peers: a peer without credits does not block the other
      - test/tb_bingo_hw_manager_rlink_proxy_timeout.sv     # level 3: a lost remote done stops the proxy after the timeout
      - test/tb_bingo_hw_manager_rlink_proxy_timeout_slow.sv # level 3: slow remote dones within the timeout do not trip it
      - test/tb_bingo_hw_manager_rlink_loopback.sv         # level 3 over remote_link: single-chiplet loopback (force remote)
      - test/tb_bingo_hw_manager_rlink_no_target.sv        # level 3 over remote_link: a type without a target is stuck, others export
      - test/tb_bingo_hw_manager_rlink_reject.sv           # level 3 over remote_link: reject on import, the link keeps working
      - test/tb_bingo_hw_manager_rlink_bounce.sv           # level 3 over remote_link: the executing core dies, imports bounce back
      - test/tb_bingo_hw_manager_pm_fault_aware.sv         # control plane: a fenced core does not keep its power domain awake
      - test/tb_bingo_hw_manager_substitute_least_loaded.sv # control plane: a dead core's tasks go to the least loaded core
      - test/tb_bingo_hw_manager_pm_slow_watchdog.sv       # control plane: the watchdog counts normal-clock cycles in a slow domain
      - test/tb_bingo_hw_manager_pm_recovery_boost.sv      # control plane: a dead core's substitute runs at the boost level
      - test/tb_bingo_hw_manager_exit_idle.sv              # exited cores idle and stop boosting; a ready read clears exit
      - test/tb_bingo_hw_manager_pm_idle_delay.sv          # control plane: idle level only after an idle entry delay
      - test/tb_bingo_hw_manager_pm_access_wake.sv         # control plane: an external access keeps the cluster awake
      - test/tb_bingo_hw_manager_pm_access_wake_delay.sv   # same, with an idle entry delay
      - test/tb_bingo_hw_manager_park.sv                # core parking: in-flight stays, later tasks move
      - test/tb_bingo_hw_manager_park_no_substitute.sv  # core parking: no live substitute, request fails
      - test/tb_bingo_hw_manager_park_fence.sv          # core parking: a fence during the drain drops it
      - test/tb_bingo_hw_manager_park_sub_fence.sv        # parking: the parked core's substitute dies, a third core takes over
      - test/tb_bingo_hw_manager_park_sub_fence_last.sv   # parking: the substitute dies and none is left, the park fails
      - test/tb_bingo_hw_manager_park_target.sv           # parking: a core that runs another core's tasks cannot be parked
      - test/tb_bingo_hw_manager_park_mutual.sv           # parking: two cores asked at once never park onto each other
      - test/tb_bingo_hw_manager_unpark.sv                # parking: move back after the tasks on the substitute retired
      - test/tb_bingo_hw_manager_unpark_cancel.sv         # parking: move back cancelled / immediate
      - test/tb_bingo_hw_manager_risk_park.sv             # fault precursors: late beats -> at risk -> parked, clear moves back
      - test/tb_bingo_hw_manager_risk_derate.sv           # fault precursors: no substitute, park fails, domain derated
      - test/tb_bingo_hw_manager_risk_decay.sv            # fault precursors: sparse late beats decay, a burst trips
      - test/tb_bingo_hw_manager_boost_capacity.sv        # capacity boost: survivors of a type, budget per lost core, minimum load
      - test/tb_bingo_hw_manager_boost_capacity_edges.sv  # capacity boost: lost-slot accounting, shared/derated domains, at-risk parking
      - test/tb_bingo_hw_manager_park_random.sv           # random graph, fault and park / move back (seeds in run_regression.sh)
      - test/tb_bingo_hw_manager_rlink_random.sv           # level 3 over remote_link: random (scripts/run_replay_random.sh)
      - test/tb_bingo_hw_manager_rlink_random_reject.sv    # level 3 over remote_link: random, a hang on each chiplet (rejects)
      - test/tb_bingo_hw_manager_replay_random.sv          # random graph + random fault (scripts/run_replay_random.sh)

  # NOTE: Generated test files in test/generated/ are NOT listed here.
  # They are picked up automatically by compile_vsim.sh via shell glob.
  # To regenerate: python3 scripts/run_all_tests.py --stress 50 --emit-sv
